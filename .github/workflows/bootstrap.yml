name: Publish repository payload

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/payload.tar.xz'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        run: |
          set -euo pipefail
          test -f .bootstrap/payload.tar.xz
          tmp="$(mktemp -d)"
          tar -xJf .bootstrap/payload.tar.xz -C "$tmp"
          rsync -a --delete --exclude='.git/' "$tmp/" ./
          rm -rf "$tmp"

      - name: Commit published project
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Repository already matches the payload.'
            exit 0
          fi
          git commit -m 'Publish Dramatic Sky Ride alpha.12'
          git push origin HEAD:main

# Second push intentionally triggers publication after the workflow exists.
