name: Clean rewrite CI
on:
  push:
    branches: [release/0.3.0-clean-rewrite]
  pull_request:
    paths: ['dramatic_sky_ride/**','tests/**']
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check out current Gen1Recomp
        uses: actions/checkout@v4
        with:
          repository: bryanthaboi/gen1recomp
          ref: dev
          path: gen1recomp-upstream
      - run: python tests/clean_contract.py
      - name: Lua syntax + runtime contract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 luajit >/dev/null
          find dramatic_sky_ride -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/runtime_contract.lua dramatic_sky_ride/src/runtime.lua
      - name: Current Gen1Recomp manifest/runtime validation
        run: python gen1recomp-upstream/tools/modkit.py validate dramatic_sky_ride
      - name: Current Gen1Recomp Gen2 compatibility audit
        run: python gen1recomp-upstream/tools/modkit.py gen2check dramatic_sky_ride --notes
