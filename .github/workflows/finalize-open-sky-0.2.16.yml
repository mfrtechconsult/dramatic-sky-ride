name: Finalize Open Sky 0.2.16

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard version
        id: guard
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('dramatic_sky_ride/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "0.2.16" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Recover exact native Open Sky maps
        if: steps.guard.outputs.run == 'true'
        run: python3 scripts/recover_open_sky_maps_v2.py

      - name: Verify Johto/Kanto map hashes and dimensions
        if: steps.guard.outputs.run == 'true'
        run: python3 tests/open_sky_map_asset_quality_v2.py

      - name: Install LuaJIT
        if: steps.guard.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit

      - name: Rebuild main.lua from parts
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('dramatic_sky_ride')
          src=root/'src'
          parts=[]
          for line in (src/'parts.txt').read_text(encoding='utf-8').splitlines():
              name=line.strip()
              if name and not name.startswith('#'):
                  parts.append(name)
          missing=[name for name in parts if not (src/name).is_file()]
          if missing:
              raise SystemExit('missing source parts: '+', '.join(missing))
          data='\n'.join((src/name).read_text(encoding='utf-8') for name in parts)+'\n'
          (root/'main.lua').write_text(data,encoding='utf-8')
          print('rebuilt main.lua from',len(parts),'parts')
          PY
          luajit -b dramatic_sky_ride/main.lua /tmp/dsr-main.luac

      - name: Build launcher-ready archive
        if: steps.guard.outputs.run == 'true'
        run: |
          VERSION='0.2.16'
          ZIP="dramatic-sky-ride-${VERSION}.zip"
          rm -f "$ZIP"
          rm -rf /tmp/dsr-release
          mkdir -p /tmp/dsr-release
          cp -a dramatic_sky_ride/. /tmp/dsr-release/
          find /tmp/dsr-release -name 'map2d_native_part*.b64' -delete
          (cd /tmp/dsr-release && zip -q -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -tq "$ZIP"
          python3 - <<'PY'
          import json, zipfile
          z=zipfile.ZipFile('dramatic-sky-ride-0.2.16.zip')
          manifest=json.loads(z.read('manifest.json'))
          assert manifest['version']=='0.2.16'
          assert 'filesystem' not in manifest.get('permissions',[])
          assert 'main.lua' in z.namelist()
          print('PASS launcher-ready archive')
          PY
          sha256sum "$ZIP" | tee "${ZIP}.sha256"

      - name: Publish corrected 0.2.16 asset
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='v0.2.16'
          ZIP='dramatic-sky-ride-0.2.16.zip'
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title 'Dramatic Sky Ride 0.2.16' --notes-file dramatic_sky_ride/RELEASE_NOTES_0.2.16.md
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title 'Dramatic Sky Ride 0.2.16' --notes-file dramatic_sky_ride/RELEASE_NOTES_0.2.16.md --target "$GITHUB_SHA"
          fi
