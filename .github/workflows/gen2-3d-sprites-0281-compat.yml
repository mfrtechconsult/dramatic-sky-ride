name: Gen2-3D-Sprites 0.2.81 compatibility

on:
  push:
    branches:
      - main
      - hotfix/open-sky-map-quality-0.2.16
      - hotfix/gen2-sprite-provider-0.2.17
    paths:
      - dramatic_sky_ride/src/main_28_stadium_compat.lua
      - dramatic_sky_ride/src/main_40a_gen2_embedded_hgss.lua
      - dramatic_sky_ride/src/main_40b_gen2_hgss_surf_visual.lua
      - dramatic_sky_ride/src/main_58_gen2_voxel_interop.lua
      - dramatic_sky_ride/src/main_60_gen2_voxel_runtime_compat.lua
      - dramatic_sky_ride/src/main_64_gen2_live_mount_visibility.lua
      - dramatic_sky_ride/src/parts.txt
      - dramatic_sky_ride/manifest.json
      - .github/workflows/gen2-3d-sprites-0281-compat.yml
  pull_request:
    branches:
      - main
    paths:
      - dramatic_sky_ride/src/main_28_stadium_compat.lua
      - dramatic_sky_ride/src/main_40a_gen2_embedded_hgss.lua
      - dramatic_sky_ride/src/main_40b_gen2_hgss_surf_visual.lua
      - dramatic_sky_ride/src/main_58_gen2_voxel_interop.lua
      - dramatic_sky_ride/src/main_60_gen2_voxel_runtime_compat.lua
      - dramatic_sky_ride/src/main_64_gen2_live_mount_visibility.lua
      - dramatic_sky_ride/src/parts.txt
      - dramatic_sky_ride/manifest.json
      - .github/workflows/gen2-3d-sprites-0281-compat.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Dramatic Sky Ride
        uses: actions/checkout@v4
        with:
          path: dsr

      - name: Check out Gen2-3D-Sprites 0.2.81
        uses: actions/checkout@v4
        with:
          repository: randyadr/Gen2-3D-Sprites
          ref: v0.2.81
          path: stadium2

      - name: Verify public provider contract and DSR fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          stadium = Path('stadium2')
          dsr = Path('dsr/dramatic_sky_ride')

          manifest = json.loads((stadium / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['id'] == 'STADIUM2_OVERWORLD_MODELS'
          assert manifest['version'] == '0.2.81'

          options = (stadium / 'options.lua').read_text(encoding='utf-8')
          main = (stadium / 'main.lua').read_text(encoding='utf-8')
          embedded_wilds = (stadium / 'lib/EmbeddedWildsMain.lua').read_text(encoding='utf-8')
          bridge = (stadium / 'lib/GoldVoxelBridge.lua').read_text(encoding='utf-8')
          overworld = (stadium / 'lib/OverworldStadium.lua').read_text(encoding='utf-8')
          sprites = (stadium / 'lib/sprite_providers.lua').read_text(encoding='utf-8')
          compat = (dsr / 'src/main_28_stadium_compat.lua').read_text(encoding='utf-8')
          embedded = (dsr / 'src/main_40a_gen2_embedded_hgss.lua').read_text(encoding='utf-8')
          surf = (dsr / 'src/main_40b_gen2_hgss_surf_visual.lua').read_text(encoding='utf-8')
          runtime = (dsr / 'src/main_60_gen2_voxel_runtime_compat.lua').read_text(encoding='utf-8')
          live_visibility = (dsr / 'src/main_64_gen2_live_mount_visibility.lua').read_text(encoding='utf-8')
          parts = (dsr / 'src/parts.txt').read_text(encoding='utf-8')

          for token in ('key = "stadium3dSprites"', '3D POKéMON MODELS'):
              assert token in options, token
          for token in ('mod.exports.modelsEnabled = BaseV.modelsEnabled',
                        'mod.exports.voxelPipelineState = voxelPipelineState',
                        'mod.exports.overworld = Stadium'):
              assert token in main, token
          for token in ('mod.exports.spriteProviders = render.spriteProviders',
                        'mod.exports.registerSpriteProvider',
                        'mod.exports.resolveFollowerSprite'):
              assert token in embedded_wilds, token
          for token in ('function Bridge.setExtraEntitiesProvider',
                        'pokemonModels = modelsEnabled()',
                        'function Bridge.status()'):
              assert token in bridge, token
          for token in ('function OverworldStadium.canRenderEntity',
                        'if not modelsEnabled() then return false, nil end'):
              assert token in overworld, token

          for token in ('function SpriteProviders:resolve(style, speciesId, variant, game)',
                        'followers = { "followers_ex", "pokemmo", "pokedex" }',
                        'frames = 6', 'walker = true'):
              assert token in sprites, token

          for token in ('gen2PokemonModelsEnabled', 'gen2MountModelReady',
                        'return gen2MountModelReady(species)', 'api = 8'):
              assert token in compat, token

          # Use Randy's public embedded Wilds resolver first, with its internal
          # registry retained only as a compatibility fallback. Current style,
          # Followers/GSC, and PokeMMO are all valid mount sources.
          for token in ('wilds.resolveFollowerSprite', 'directProviderAttempt',
                        'ctx.spriteProviders.resolve', 'registerSpriteSource',
                        'dramaticSkyRideEmbeddedSpriteProvider',
                        'gen2EmbeddedSpriteMounts', 'api = 4',
                        '"followers", "pokemmo"'):
              assert token in embedded, token
          assert 'style ~= "pokemmo"' not in embedded
          assert 'requested2D' not in embedded
          assert 'frames < 6' in embedded
          assert 'gen2EmbeddedPokeMMOMounts = mod.exports.gen2EmbeddedSpriteMounts' in embedded
          assert 'gen2EmbeddedPokeMMOMounts' in surf

          # Current Gold is a native Gen2 World and need not traverse the old
          # Gen1 OverworldController update seam. The late visibility guard must
          # reconcile the already-resolved Pokemon sprite from world.stepped.
          for token in ('mod.events:on("world.stepped", sync)',
                        'player.sprite = sprite',
                        'player.dramaticSkyRideMountSpecies = species',
                        'gen2LiveMountVisibility', 'ownsPlayerSprite'):
              assert token in live_visibility, token
          assert 'main_64_gen2_live_mount_visibility.lua' in parts

          assert 'renderer2D()' in runtime
          assert 'buildNativeHgssCard' in runtime
          assert 'install2DBillboardSizeHook' in runtime

          dsr_manifest = json.loads((dsr / 'manifest.json').read_text(encoding='utf-8'))
          assert 'filesystem' not in dsr_manifest.get('permissions', [])
          print('Gen2-3D-Sprites v0.2.81 model + sprite + live Gold mount contract: OK')
          PY

      - name: Compile Dramatic Sky Ride runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y luajit >/dev/null
          python - <<'PY'
          from pathlib import Path
          root = Path('dsr/dramatic_sky_ride')
          parts = [p.strip() for p in (root / 'src/parts.txt').read_text().splitlines() if p.strip()]
          chunks = []
          previous_ends_semicolon = False
          for part in parts:
              text = (root / 'src' / part).read_text(encoding='utf-8')
              if previous_ends_semicolon:
                  i = 0
                  while i < len(text) and text[i].isspace(): i += 1
                  if i < len(text) and text[i] == ';':
                      text = text[:i] + text[i+1:]
              chunks.append(text)
              previous_ends_semicolon = text.rstrip().endswith(';')
          Path('/tmp/dsr.lua').write_text(''.join(chunks), encoding='utf-8')
          PY
          luajit -b /tmp/dsr.lua /tmp/dsr.ljbc

      - name: Build launcher-ready test archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("dsr/dramatic_sky_ride/manifest.json", encoding="utf-8"))["version"])')
          mkdir -p /tmp/dsr-artifact
          ARCHIVE="/tmp/dsr-artifact/dramatic-sky-ride-${VERSION}-gen2-live-mount-test.zip"
          cd dsr
          zip -qr "$ARCHIVE" dramatic_sky_ride
          unzip -t "$ARCHIVE"

      - name: Upload launcher-ready test archive
        uses: actions/upload-artifact@v4
        with:
          name: dramatic-sky-ride-gen2-live-mount-test
          path: /tmp/dsr-artifact/*.zip
          if-no-files-found: error
          retention-days: 14
