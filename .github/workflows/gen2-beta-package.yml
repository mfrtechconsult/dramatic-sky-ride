name: Build Gen2 beta package

on:
  push:
    branches:
      - agent/gen2-gen1recomp-plus-compat
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsr-gen2-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta-package:
    name: Gen2 beta ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dramatic Sky Ride
        uses: actions/checkout@v7

      - name: Checkout current Gen1Recomp++
        uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          path: gen1recomp-upstream

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit zip unzip

      - name: Prepare isolated beta package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dsr-gen2-beta
          mkdir -p /tmp/dsr-gen2-beta
          cp -a dramatic_sky_ride /tmp/dsr-gen2-beta/dramatic_sky_ride
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/dsr-gen2-beta/dramatic_sky_ride')
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['games'] = ['gen1', 'gen2']
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          sha = os.environ.get('GITHUB_SHA', 'unknown')
          (root / 'GEN2_BETA_TESTING.txt').write_text(
              'DRAMATIC SKY RIDE - GEN2 / GOLD BETA\n'
              '====================================\n\n'
              'This ZIP is an UNVERIFIED compatibility test build.\n'
              'The repository manifest intentionally remains Gen1-only until a real Gold boot is validated.\n\n'
              f'Build commit: {sha}\n\n'
              'Priority smoke tests:\n'
              '1. Boot Gold with DSR enabled.\n'
              '2. Verify normal walking and menus before mounting.\n'
              '3. Test a flying mount and STORM Badge gating.\n'
              '4. Test a land Ground Ride mount.\n'
              '5. Test Suicune land -> water -> land with SURF + FOG Badge.\n'
              '6. Test Suicune across a map connection while on water.\n'
              '7. Start and finish a battle while riding Suicune on water.\n'
              '8. Test Visible Surf and one airborne Wild Skies encounter if installed.\n'
              '9. Save/reload and confirm normal movement still works.\n',
              encoding='utf-8')
          PY

      - name: Validate beta target against Gen1Recomp++
        shell: bash
        run: |
          set -euo pipefail
          python3 gen1recomp-upstream/tools/modkit.py gen2check \
            /tmp/dsr-gen2-beta/dramatic_sky_ride --notes \
            | tee /tmp/dsr-gen2-beta-check.txt

      - name: Compile beta runtime with LuaJIT
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/dsr-gen2-beta/dramatic_sky_ride')
          parts = [p.strip() for p in (root / 'src/parts.txt').read_text().splitlines() if p.strip()]
          chunks = []
          previous_ends_semicolon = False
          for part in parts:
              text = (root / 'src' / part).read_text(encoding='utf-8')
              if previous_ends_semicolon:
                  i = 0
                  while i < len(text) and text[i].isspace():
                      i += 1
                  if i < len(text) and text[i] == ';':
                      text = text[:i] + text[i + 1:]
              chunks.append(text)
              previous_ends_semicolon = text.rstrip().endswith(';')
          Path('/tmp/dsr-gen2-beta-runtime.lua').write_text(''.join(chunks), encoding='utf-8')
          PY
          luajit -b /tmp/dsr-gen2-beta-runtime.lua /tmp/dsr-gen2-beta-runtime.ljbc
          luajit -b /tmp/dsr-gen2-beta/dramatic_sky_ride/main.lua /tmp/dsr-gen2-beta-main.ljbc
          luajit -b /tmp/dsr-gen2-beta/dramatic_sky_ride/mod.card /tmp/dsr-gen2-beta-card.ljbc

      - name: Build launcher-ready ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dsr-gen2-beta-artifact
          cd /tmp/dsr-gen2-beta
          zip -qr /tmp/dsr-gen2-beta-artifact/dramatic-sky-ride-0.2.2-gen2-beta.zip dramatic_sky_ride
          unzip -t /tmp/dsr-gen2-beta-artifact/dramatic-sky-ride-0.2.2-gen2-beta.zip

      - name: Upload Gen2 beta
        uses: actions/upload-artifact@v4
        with:
          name: dramatic-sky-ride-gen2-beta
          path: /tmp/dsr-gen2-beta-artifact/dramatic-sky-ride-0.2.2-gen2-beta.zip
          if-no-files-found: error
          retention-days: 14
