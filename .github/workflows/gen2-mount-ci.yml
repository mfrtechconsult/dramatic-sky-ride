name: Gen2 mount contracts

on:
  push:
    branches:
      - compat/wilds-of-kanto
      - agent/gen2-stadium2-voxel-interop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gen2 roster and Suicune amphibious contract
        run: python3 tests/gen2_mount_contract.py dramatic_sky_ride

      - name: Validate Gen2 voxel interop contract
        run: python3 tests/gen2_voxel_interop_contract.py dramatic_sky_ride

      - name: Checkout supported visual providers
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch compat/wilds-of-kanto \
            https://github.com/mfrtechconsult/PokePCFollowers.git /tmp/pokepc
          git clone --depth 1 \
            https://github.com/YoDrehDenSwagAuf/overworld-spawn-mod.git /tmp/wilds
          git clone --depth 1 \
            https://github.com/randyadr/Gen2-3D-Sprites.git /tmp/gen2-3d-sprites

      - name: Validate Gen2 voxel flight encounter and 2D sizing contract
        run: python3 tests/gen2_voxel_runtime_compat_contract.py dramatic_sky_ride /tmp/gen2-3d-sprites

      - name: Validate maintained PokéPC fork contract and Gen2 art
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'mfrtechconsult/PokePCFollowers' /tmp/pokepc/compat_entry.lua
          grep -Fq 'providerGenerations = { 1, 2 }' /tmp/pokepc/compat_entry.lua
          python3 - <<'PY'
          from pathlib import Path
          dexes = [154,160,164,169,178,203,217,226,227,230,232,234,243,244,245,248,249,250]
          missing = [d for d in dexes if not Path(f"/tmp/pokepc/assets/sprites/follower_{d:03d}.png").is_file()]
          assert not missing, f"PokéPC missing Gen2 mount sheets: {missing}"
          print("maintained PokéPC Gen2 mount art: PASS")
          PY

      - name: Validate Wilds Gen2 follower mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          mapping = Path('/tmp/wilds/assets/enhanced_overworld/followsprites_mapping/followsprites_mapping.json')
          data = json.loads(mapping.read_text(encoding='utf-8'))
          species = data.get('species', {})
          present = set()
          for key, row in species.items():
              try:
                  present.add(int((row or {}).get('speciesId', key)))
              except (TypeError, ValueError):
                  pass
          dexes = {154,160,164,169,178,203,217,226,227,230,232,234,243,244,245,248,249,250}
          missing = sorted(dexes - present)
          assert not missing, f"Wilds missing Gen2 mount mapping: {missing}"
          print("Wilds Gen2 mount mapping: PASS")
          PY

      - name: Validate Gen2-3D-Sprites compatibility seams
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/gen2-3d-sprites')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('id') == 'STADIUM2_OVERWORLD_MODELS', manifest.get('id')
          assert 'gen2' in manifest.get('games', []), manifest.get('games')
          main = (root / 'main.lua').read_text(encoding='utf-8')
          bridge = (root / 'lib/GoldVoxelBridge.lua').read_text(encoding='utf-8')
          stadium = (root / 'lib/OverworldStadium.lua').read_text(encoding='utf-8')
          assert 'mod.exports.overworld' in main
          assert 'voxelPipelineState' in main
          assert 'setExtraEntitiesProvider' in bridge
          assert 'dramaticSkyRideMountSpecies' in stadium
          assert 'skyRideMountSpecies' in stadium
          assert '_stadiumSkyRideMount' in stadium
          print('Gen2-3D-Sprites DSR compatibility seams: PASS')
          PY
