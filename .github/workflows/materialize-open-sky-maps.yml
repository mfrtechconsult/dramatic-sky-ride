name: Materialize Open Sky native maps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only run for 0.2.16 map hotfix
        id: guard
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('dramatic_sky_ride/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "0.2.16" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover exact v20 Open Sky maps
        if: steps.guard.outputs.skip == 'false'
        run: python3 scripts/recover_open_sky_maps_v2.py

      - name: Install permanent regression test
        if: steps.guard.outputs.skip == 'false'
        run: cp tests/open_sky_map_asset_quality_v2.py tests/open_sky_map_asset_quality.py

      - name: Validate recovered source tree
        if: steps.guard.outputs.skip == 'false'
        run: python3 tests/open_sky_map_asset_quality.py

      - name: Commit recovered text assets to main
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dramatic_sky_ride/assets/open_sky_stadium2/johto/map2d.b64
          git add dramatic_sky_ride/assets/open_sky_stadium2/johto/map2d_full_part*.b64
          git add dramatic_sky_ride/assets/open_sky_stadium2/kanto/map2d.b64
          git add dramatic_sky_ride/assets/open_sky_stadium2/kanto/map2d_full_part*.b64
          git add tests/open_sky_map_asset_quality.py
          git add -u dramatic_sky_ride/assets/open_sky_stadium2
          if git diff --cached --quiet; then
            echo "Open Sky maps already materialized"
            exit 0
          fi
          git commit -m "fix: materialize native Open Sky maps"
          git push origin HEAD:main
