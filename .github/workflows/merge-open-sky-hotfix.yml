name: Merge validated Open Sky hotfix

on:
  push:
    branches: [ 'hotfix/open-sky-map-quality-0.2.16' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require successful recovery proof
        run: test -f dramatic_sky_ride/OPEN_SKY_MAP_RECOVERY_OK

      - name: Revalidate exact Open Sky maps
        run: |
          python3 scripts/recover_open_sky_maps_v2.py
          python3 tests/open_sky_map_asset_quality_v2.py

      - name: Fast-forward main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
