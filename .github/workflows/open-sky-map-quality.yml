name: Open Sky map quality

on:
  push:
    branches: [ main, 'hotfix/**', 'release/**' ]
  pull_request:

jobs:
  validate-open-sky-maps:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate native Open Sky map assets
        run: python3 tests/open_sky_map_asset_quality.py
      - name: Ensure release stays filesystem-free
        run: |
          python3 - <<'PY'
          import json
          manifest = json.load(open('dramatic_sky_ride/manifest.json', encoding='utf-8'))
          assert 'filesystem' not in manifest.get('permissions', []), manifest.get('permissions')
          print('PASS: no filesystem permission')
          PY
