name: Prove Open Sky recovery

on:
  push:
    branches: [ 'hotfix/open-sky-map-quality-0.2.16' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover exact native maps
        run: python3 scripts/recover_open_sky_maps_v2.py
      - name: Validate exact native maps
        run: python3 tests/open_sky_map_asset_quality_v2.py
      - name: Record proof on branch
        run: |
          cat > dramatic_sky_ride/OPEN_SKY_MAP_RECOVERY_OK <<'EOF'
          Open Sky map recovery validated.
          Johto 312x232 sha256=3871173ba9fc0c2ff73eeaf410caa24506244312bca719292c245e134f07816d
          Kanto 312x232 sha256=e9606dbd6ca347f9ceaf0dd5735010a1032024cf9f34740b0505ed17801ba19f
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dramatic_sky_ride/OPEN_SKY_MAP_RECOVERY_OK
          if git diff --cached --quiet; then
            echo "proof already recorded"
            exit 0
          fi
          git commit -m "ci: confirm Open Sky map recovery"
          git push origin HEAD:hotfix/open-sky-map-quality-0.2.16
