name: Open Sky native map recovery

on:
  push:
    branches: [ 'hotfix/open-sky-map-quality-0.2.16', main ]
  workflow_dispatch:

jobs:
  recover-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Recover validated Open Sky maps
        run: python3 scripts/recover_open_sky_maps_v2.py
      - name: Verify exact native maps
        run: |
          python3 - <<'PY'
          import base64, hashlib, struct
          from pathlib import Path
          cfg = {
              'johto': (5, 120401, '3871173ba9fc0c2ff73eeaf410caa24506244312bca719292c245e134f07816d'),
              'kanto': (6, 115824, 'e9606dbd6ca347f9ceaf0dd5735010a1032024cf9f34740b0505ed17801ba19f'),
          }
          root = Path('dramatic_sky_ride/assets/open_sky_stadium2')
          for region, (count, size, expected) in cfg.items():
              data = b''.join(base64.b64decode((root/region/f'map2d_full_part{i:02d}.b64').read_text()) for i in range(1, count+1))
              assert len(data) == size, (region, len(data))
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II', data[16:24]) == (312, 232)
              assert hashlib.sha256(data).hexdigest() == expected
              print('PASS', region, len(data), expected)
          PY
      - name: Ensure sandbox permissions stay clean
        run: |
          python3 - <<'PY'
          import json
          manifest=json.load(open('dramatic_sky_ride/manifest.json'))
          assert 'filesystem' not in manifest.get('permissions', [])
          print('PASS no filesystem permission')
          PY
