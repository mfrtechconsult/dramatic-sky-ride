name: Package Wilds dev build

on:
  push:
    branches:
      - compat/wilds-of-kanto
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate launcher layout
        shell: bash
        run: |
          set -euo pipefail
          test -f dramatic_sky_ride/manifest.json
          test -f dramatic_sky_ride/main.lua
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('dramatic_sky_ride')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          entry = manifest.get('entry', 'main.lua')
          assert (root / entry).is_file(), f'missing manifest entry: {entry}'
          print(f"Launcher layout OK: {manifest['id']} {manifest['version']} -> {entry}")
          PY

      # Upload the mod directory itself, not a pre-zipped file. GitHub Actions
      # creates the artifact ZIP, so manifest.json/main.lua end up directly at
      # the archive root instead of inside a second nested ZIP.
      - name: Upload launcher-ready dev build
        uses: actions/upload-artifact@v4
        with:
          name: dramatic-sky-ride-wilds-dev-launcher-ready
          path: dramatic_sky_ride/
          if-no-files-found: error
          retention-days: 7
