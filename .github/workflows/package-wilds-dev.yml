name: Package Wilds dev build

on:
  push:
    branches:
      - compat/wilds-of-kanto
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("dramatic_sky_ride/manifest.json", encoding="utf-8"))["version"])')
          ZIP="dramatic-sky-ride-${VERSION}-wilds-dev.zip"
          (
            cd dramatic_sky_ride
            zip -qr "../$ZIP" . -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store" "Thumbs.db"
          )
          unzip -Z1 "$ZIP" | grep -qx 'manifest.json'
          unzip -t "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload dev build
        uses: actions/upload-artifact@v4
        with:
          name: dramatic-sky-ride-wilds-dev
          path: ${{ env.ZIP }}
          if-no-files-found: error
          retention-days: 7
