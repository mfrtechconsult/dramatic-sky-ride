name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - dramatic_sky_ride/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("dramatic_sky_ride/manifest.json", encoding="utf-8"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=dramatic_sky_ride-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Validate manifest and Lua source
        shell: bash
        run: |
          python -m json.tool dramatic_sky_ride/manifest.json > /dev/null
          sudo apt-get update
          sudo apt-get install -y lua5.4
          : > /tmp/dramatic_sky_ride.lua
          while IFS= read -r part; do
            cat "dramatic_sky_ride/src/$part" >> /tmp/dramatic_sky_ride.lua
          done < dramatic_sky_ride/src/parts.txt
          luac -p dramatic_sky_ride/main.lua dramatic_sky_ride/mod.card /tmp/dramatic_sky_ride.lua

      - name: Build install archive
        shell: bash
        run: |
          ARCHIVE="${{ steps.version.outputs.archive }}"
          (
            cd dramatic_sky_ride
            zip -qr "../$ARCHIVE" . \
              -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store" "Thumbs.db"
          )
          unzip -Z1 "$ARCHIVE" | grep -qx 'manifest.json'
          unzip -t "$ARCHIVE"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          ## Dramatic Sky Ride 0.1.0

          First stable Dramatic Sky Ride release for Gen1Recomp.

          ### Highlights
          - controllable flying, Ground Ride and visible Surf mounts;
          - Pokédex-proportional mount sizing with per-species controls;
          - story-aware FLY progression with FLY, THUNDERBADGE and SOULBADGE checks;
          - discovery gates that stop first-time airborne sequence breaks on vanilla Kanto maps while leaving unknown/custom maps open by default;
          - camera-directed altitude control in Dramatic Shape 1ST/3RD;
          - optional Wild Skies integration through its public API, including species-specific sprites and exact visible flyer species/level encounters;
          - stable battle restoration, connected-map traversal and mounted interaction safeguards.

          Wild Skies remains a separate optional mod. Free Fly is an alternative flight engine and is declared conflicting with DSR.

          The release ZIP uses the Gen1Recomp Mod Index / launcher layout with `manifest.json` at the archive root.
          NOTES

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
            gh release edit "$TAG" --title "Dramatic Sky Ride $VERSION" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "Dramatic Sky Ride $VERSION" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Record successful publication
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          printf 'version=%s\ntag=%s\nasset=%s\ncommit=%s\n' \
            "$VERSION" "$TAG" "$ARCHIVE" "$GITHUB_SHA" > .github/released-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/released-version
          if ! git diff --cached --quiet; then
            git commit -m "Record published release $TAG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
