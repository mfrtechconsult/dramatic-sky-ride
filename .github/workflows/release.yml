name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - dramatic_sky_ride/manifest.json
      - dramatic_sky_ride/src/**
      - dramatic_sky_ride/audio/**
      - dramatic_sky_ride/README.md
      - dramatic_sky_ride/CHANGELOG.md
      - dramatic_sky_ride/RELEASE_NOTES_*.md
      - dramatic_sky_ride/mod.card
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dsr-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("dramatic_sky_ride/manifest.json", encoding="utf-8"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=dramatic-sky-ride-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "notes=dramatic_sky_ride/RELEASE_NOTES_$VERSION.md" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_NAME" = "compat/wilds-of-kanto" ]; then
            case "$VERSION" in
              *-rc.*|*-beta.*|*-alpha.*) ;;
              *) echo "Compatibility branch must publish a prerelease version, got $VERSION" >&2; exit 1 ;;
            esac
          fi

      - name: Install LuaJIT
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Validate repository runtime source
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool dramatic_sky_ride/manifest.json > /dev/null

          if grep -R -n -F 'require("src.link.Json")' dramatic_sky_ride/src \
             || grep -R -n -F 'Json.decode' dramatic_sky_ride/src; then
            echo "Release source must not depend on network-gated src.link.Json" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          root = Path("dramatic_sky_ride")
          parts = [p.strip() for p in (root / "src/parts.txt").read_text().splitlines() if p.strip()]
          chunks = []
          previous_ends_semicolon = False
          for part in parts:
              path = root / "src" / part
              if not path.is_file():
                  raise SystemExit(f"missing source part: {path}")
              text = path.read_text()
              if previous_ends_semicolon:
                  i = 0
                  while i < len(text) and text[i].isspace():
                      i += 1
                  if i < len(text) and text[i] == ';':
                      text = text[:i] + text[i + 1:]
              chunks.append(text)
              previous_ends_semicolon = text.rstrip().endswith(';')
          Path('/tmp/dramatic_sky_ride.lua').write_text(''.join(chunks))
          PY
          luajit -b /tmp/dramatic_sky_ride.lua /tmp/dramatic_sky_ride.ljbc
          luajit -b dramatic_sky_ride/main.lua /tmp/dsr_main.ljbc
          luajit -b dramatic_sky_ride/mod.card /tmp/dsr_card.ljbc
          echo "Repository runtime concat lines: $(wc -l < /tmp/dramatic_sky_ride.lua)"

      - name: Build install archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.version.outputs.archive }}"
          (
            cd dramatic_sky_ride
            zip -qr "../$ARCHIVE" . \
              -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store" "Thumbs.db"
          )
          unzip -Z1 "$ARCHIVE" | grep -qx 'manifest.json'
          unzip -t "$ARCHIVE"

      - name: Validate exact release ZIP with LuaJIT
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.version.outputs.archive }}"
          rm -rf /tmp/dsr-release-check
          mkdir -p /tmp/dsr-release-check
          unzip -q "$ARCHIVE" -d /tmp/dsr-release-check
          python -m json.tool /tmp/dsr-release-check/manifest.json > /dev/null
          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/dsr-release-check')
          parts = [p.strip() for p in (root / 'src/parts.txt').read_text().splitlines() if p.strip()]
          chunks = []
          previous_ends_semicolon = False
          for part in parts:
              path = root / 'src' / part
              if not path.is_file():
                  raise SystemExit(f"missing packaged source part: {path}")
              text = path.read_text()
              if previous_ends_semicolon:
                  i = 0
                  while i < len(text) and text[i].isspace():
                      i += 1
                  if i < len(text) and text[i] == ';':
                      text = text[:i] + text[i + 1:]
              chunks.append(text)
              previous_ends_semicolon = text.rstrip().endswith(';')
          Path('/tmp/dsr-release-sky-ride.lua').write_text(''.join(chunks))
          PY
          luajit -b /tmp/dsr-release-sky-ride.lua /tmp/dsr-release-sky-ride.ljbc
          luajit -b /tmp/dsr-release-check/main.lua /tmp/dsr-release-main.ljbc
          luajit -b /tmp/dsr-release-check/mod.card /tmp/dsr-release-card.ljbc
          echo "Release ZIP runtime concat lines: $(wc -l < /tmp/dsr-release-sky-ride.lua)"
          sha256sum "$ARCHIVE"

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES="${{ steps.version.outputs.notes }}"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" /tmp/release-notes.md
          else
            cat > /tmp/release-notes.md <<NOTES
          ## Dramatic Sky Ride ${{ steps.version.outputs.version }}

          See the bundled CHANGELOG.md for this release's changes.

          The attached ZIP is launcher-ready and is reconstructed and compiled with LuaJIT after packaging before publication.
          NOTES
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
            if [ "$GITHUB_REF_NAME" = "compat/wilds-of-kanto" ]; then
              gh release edit "$TAG" --title "Dramatic Sky Ride $VERSION" --notes-file /tmp/release-notes.md --prerelease
            else
              gh release edit "$TAG" --title "Dramatic Sky Ride $VERSION" --notes-file /tmp/release-notes.md --latest
            fi
          else
            if [ "$GITHUB_REF_NAME" = "compat/wilds-of-kanto" ]; then
              gh release create "$TAG" "$ARCHIVE" \
                --target "$GITHUB_SHA" \
                --title "Dramatic Sky Ride $VERSION" \
                --notes-file /tmp/release-notes.md \
                --prerelease
            else
              gh release create "$TAG" "$ARCHIVE" \
                --target "$GITHUB_SHA" \
                --title "Dramatic Sky Ride $VERSION" \
                --notes-file /tmp/release-notes.md \
                --latest
            fi
          fi

      - name: Record successful stable publication
        if: github.ref_name == 'main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          printf 'version=%s\ntag=%s\nasset=%s\ncommit=%s\n' \
            "$VERSION" "$TAG" "$ARCHIVE" "$GITHUB_SHA" > .github/released-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/released-version
          if ! git diff --cached --quiet; then
            git commit -m "Record published release $TAG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
