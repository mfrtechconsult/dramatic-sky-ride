name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - dramatic_sky_ride/manifest.json
      - dramatic_sky_ride/src/**
      - dramatic_sky_ride/README.md
      - dramatic_sky_ride/CHANGELOG.md
      - dramatic_sky_ride/mod.card
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("dramatic_sky_ride/manifest.json", encoding="utf-8"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=dramatic_sky_ride-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Install LuaJIT
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Validate repository runtime source
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool dramatic_sky_ride/manifest.json > /dev/null
          : > /tmp/dramatic_sky_ride.lua
          while IFS= read -r part; do
            test -n "$part" || continue
            cat "dramatic_sky_ride/src/$part" >> /tmp/dramatic_sky_ride.lua
          done < dramatic_sky_ride/src/parts.txt
          luajit -b /tmp/dramatic_sky_ride.lua /tmp/dramatic_sky_ride.ljbc
          luajit -b dramatic_sky_ride/main.lua /tmp/dsr_main.ljbc
          luajit -b dramatic_sky_ride/mod.card /tmp/dsr_card.ljbc
          echo "Repository runtime concat lines: $(wc -l < /tmp/dramatic_sky_ride.lua)"

      - name: Build install archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.version.outputs.archive }}"
          (
            cd dramatic_sky_ride
            zip -qr "../$ARCHIVE" . \
              -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store" "Thumbs.db"
          )
          unzip -Z1 "$ARCHIVE" | grep -qx 'manifest.json'
          unzip -t "$ARCHIVE"

      - name: Validate exact release ZIP with LuaJIT
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.version.outputs.archive }}"
          rm -rf /tmp/dsr-release-check
          mkdir -p /tmp/dsr-release-check
          unzip -q "$ARCHIVE" -d /tmp/dsr-release-check
          python -m json.tool /tmp/dsr-release-check/manifest.json > /dev/null
          : > /tmp/dsr-release-sky-ride.lua
          while IFS= read -r part; do
            test -n "$part" || continue
            cat "/tmp/dsr-release-check/src/$part" >> /tmp/dsr-release-sky-ride.lua
          done < /tmp/dsr-release-check/src/parts.txt
          luajit -b /tmp/dsr-release-sky-ride.lua /tmp/dsr-release-sky-ride.ljbc
          luajit -b /tmp/dsr-release-check/main.lua /tmp/dsr-release-main.ljbc
          luajit -b /tmp/dsr-release-check/mod.card /tmp/dsr-release-card.ljbc
          echo "Release ZIP runtime concat lines: $(wc -l < /tmp/dsr-release-sky-ride.lua)"
          sha256sum "$ARCHIVE"

      - name: Prepare release notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          ## Dramatic Sky Ride 0.1.3

          This release adds a second supported voxel provider, global mount speed controls and a quieter ride experience while keeping the Surf and Wild Skies improvements from 0.1.2.

          ### Voxel provider — install one
          - **Battle Art Voxel Fork 1.7.6+** (`BATTLE_ART_VOXEL_FORK`)
          - **Dramaless Shape** (`DRAMALESS_SHAPE`)

          DSR uses the providers' public `exports.lib` interfaces and selects the correct voxel pipeline (`voxel` or `st_voxel`). If both are installed, Battle Art is preferred.

          ### Required mod
          - **PokéPC Followers (W/Voxel Support)** (`PokePCFollowers_VoxelMerge`) is required for the Pokémon overworld/NPC sprites used by mounts.

          ### Wild Skies — strongly recommended
          **Wild Skies 1.4.1+ is strongly recommended.** DSR works without it, but DSR + Wild Skies is the intended airborne setup: visible Pokémon populate the sky and can be intercepted into battles against the exact visible species and level.

          ### 0.1.3 changes
          - Added **Dramaless Shape compatibility** as an alternative to Battle Art Voxel Fork.
          - Added global **FLIGHT SPEED** and **GROUND SPEED** settings from 50% to 200%.
          - Speed settings preserve species-specific differences and continue to stack with Flight boost and Ground gallop.
          - Removed the Ground Ride `JUMP` notice while keeping jump animation, audio, rumble and landing feedback.
          - Removed the `Visible Surf mount active.` activation dialog without changing Surf behavior.
          - With Battle Art: **H = Flight / G = Ground Ride**.
          - With Dramaless: **H = Flight / J = Ground Ride**, because Dramaless reserves G for V-GRID.
          - Controller controls remain **X = Flight / Y = Ground Ride** with either provider.
          - Keeps the Surf `3RD` camera fix and the more forgiving two-cell Wild Skies interception envelope from 0.1.2.

          `free_fly` remains a conflicting alternative flight engine.

          The attached ZIP is launcher-ready and is reconstructed and compiled with LuaJIT after packaging before publication.
          NOTES

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
            gh release edit "$TAG" --title "Dramatic Sky Ride $VERSION" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "Dramatic Sky Ride $VERSION" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Record successful publication
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          printf 'version=%s\ntag=%s\nasset=%s\ncommit=%s\n' \
            "$VERSION" "$TAG" "$ARCHIVE" "$GITHUB_SHA" > .github/released-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/released-version
          if ! git diff --cached --quiet; then
            git commit -m "Record published release $TAG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
