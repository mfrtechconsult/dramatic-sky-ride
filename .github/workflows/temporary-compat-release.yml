name: Publish temporary compatibility build

on:
  push:
    branches:
      - temporary/dramatic-shape-fork-compat
    paths:
      - dramatic_sky_ride/manifest.json
      - dramatic_sky_ride/src/**
      - dramatic_sky_ride/TESTING_BATTLE_ART.md
      - .github/workflows/temporary-compat-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Record workflow start
        shell: bash
        run: |
          printf 'started_for=%s\nstarted_at=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > .github/temporary-workflow-start.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/temporary-workflow-start.txt
          git commit -m "Record temporary workflow start" || true
          git push origin HEAD:temporary/dramatic-shape-fork-compat

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("dramatic_sky_ride/manifest.json", encoding="utf-8"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=dramatic_sky_ride-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Validate manifest and exact runtime Lua source
        shell: bash
        run: |
          set +e
          {
            set -x
            python -m json.tool dramatic_sky_ride/manifest.json > /dev/null
            sudo apt-get update
            sudo apt-get install -y luajit
            : > /tmp/dramatic_sky_ride.lua
            while IFS= read -r part; do
              cat "dramatic_sky_ride/src/$part" >> /tmp/dramatic_sky_ride.lua || exit 91
            done < dramatic_sky_ride/src/parts.txt
            wc -l /tmp/dramatic_sky_ride.lua
            luajit -b /tmp/dramatic_sky_ride.lua /tmp/dramatic_sky_ride.ljbc
            luajit -b dramatic_sky_ride/main.lua /tmp/dsr_main.ljbc
            luajit -b dramatic_sky_ride/mod.card /tmp/dsr_card.ljbc
          } > /tmp/dsr-validation.log 2>&1
          RC=$?
          cat /tmp/dsr-validation.log
          if [ "$RC" -ne 0 ]; then
            cp /tmp/dsr-validation.log .github/temporary-validation.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/temporary-validation.txt
            git commit -m "Record temporary LuaJIT validation failure" || true
            git push origin HEAD:temporary/dramatic-shape-fork-compat || true
            exit "$RC"
          fi
          rm -f .github/temporary-validation.txt
          echo "LuaJIT validation OK"

      - name: Build launcher-ready ZIP
        shell: bash
        run: |
          ARCHIVE="${{ steps.version.outputs.archive }}"
          (
            cd dramatic_sky_ride
            zip -qr "../$ARCHIVE" . \
              -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store" "Thumbs.db"
          )
          unzip -Z1 "$ARCHIVE" | grep -qx 'manifest.json'
          unzip -t "$ARCHIVE"

      - name: Prepare prerelease notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          ## Temporary dual-provider compatibility build

          This build keeps stable/main on v0.1.0 while validating one DSR ZIP against either supported voxel provider.

          - Upstream: `DRAMATIC_SHAPE >=1.7.0 <2.0.0`.
          - Community Battle Art: `BATTLE_ART_VOXEL_FORK >=1.7.6 <2.0.0`.
          - Full provider capability validation covers TileShape, Voxel3D, SpriteBillboards, 1ST/3RD FirstPerson controls and FreeMove.
          - Provider selection lives inside DSR's existing Dramatic Shape library loader; no `mod.find` aliasing is used.
          - The exact concatenated runtime source is compiled with LuaJIT before publication.
          - DSR keys do not overlap Battle Art 1.7.6 hotkeys: Battle Art owns 3/5/6/7/8/9; DSR keeps F/G, Page Up/Page Down, L2/R2 and SELECT+L1/R1.
          - Staged-battle ordering is explicit: Ground Ride is cleaned before Battle Art snapshots the cast, and airborne DSR visuals reconcile after the provider restores the world.
          - Wild Skies `>=1.3.1 <2.0.0` remains optional and uses its public API.
          - PokePC Followers remains optional; DSR keeps its asset/API fallbacks.
          - `free_fly` remains a conflicting alternative flight engine.
          - Do not enable upstream Dramatic Shape and Battle Art Voxel Fork simultaneously.
          - Main/stable remains v0.1.0.

          The attached ZIP is launcher-ready: `manifest.json` is at the archive root.
          NOTES

      - name: Create or update temporary prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "Dramatic Sky Ride $VERSION (temporary compatibility build)" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi

      - name: Record successful temporary publication
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          git pull --rebase origin temporary/dramatic-shape-fork-compat
          printf 'version=%s\ntag=%s\nasset=%s\ncommit=%s\n' \
            "$VERSION" "$TAG" "$ARCHIVE" "$GITHUB_SHA" > .github/temporary-released-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/temporary-released-version
          if ! git diff --cached --quiet; then
            git commit -m "Record temporary compatibility release $TAG"
            git push origin HEAD:temporary/dramatic-shape-fork-compat
          fi
