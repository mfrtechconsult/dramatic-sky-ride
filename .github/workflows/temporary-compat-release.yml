name: Publish temporary compatibility build

on:
  push:
    branches:
      - temporary/dramatic-shape-fork-compat
    paths:
      - dramatic_sky_ride/manifest.json
      - dramatic_sky_ride/src/**
      - .github/workflows/temporary-compat-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("dramatic_sky_ride/manifest.json", encoding="utf-8"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=dramatic_sky_ride-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Validate manifest and Lua source
        shell: bash
        run: |
          python -m json.tool dramatic_sky_ride/manifest.json > /dev/null
          sudo apt-get update
          sudo apt-get install -y lua5.4
          : > /tmp/dramatic_sky_ride.lua
          while IFS= read -r part; do
            cat "dramatic_sky_ride/src/$part" >> /tmp/dramatic_sky_ride.lua
          done < dramatic_sky_ride/src/parts.txt
          luac -p dramatic_sky_ride/main.lua dramatic_sky_ride/mod.card /tmp/dramatic_sky_ride.lua

      - name: Build launcher-ready ZIP
        shell: bash
        run: |
          ARCHIVE="${{ steps.version.outputs.archive }}"
          (
            cd dramatic_sky_ride
            zip -qr "../$ARCHIVE" . \
              -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store" "Thumbs.db"
          )
          unzip -Z1 "$ARCHIVE" | grep -qx 'manifest.json'
          unzip -t "$ARCHIVE"

      - name: Prepare prerelease notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          ## Temporary Dramatic Shape compatibility build

          This build is for community testing during the compatibility work for the alternate Dramatic Shape fork.

          - Supports `DRAMATIC_SHAPE >=1.3.1 <2.0.0`.
          - Uses capability detection so the official Dramatic Shape remains fully supported.
          - 1ST/3RD-specific DSR hooks are only enabled when those Dramatic Shape modules exist.
          - Main/stable remains v0.1.0.

          The attached ZIP is launcher-ready: `manifest.json` is at the archive root.
          NOTES

      - name: Create or update temporary prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "Dramatic Sky Ride $VERSION (temporary compatibility build)" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi

      - name: Record successful temporary publication
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          printf 'version=%s\ntag=%s\nasset=%s\ncommit=%s\n' \
            "$VERSION" "$TAG" "$ARCHIVE" "$GITHUB_SHA" > .github/temporary-released-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/temporary-released-version
          if ! git diff --cached --quiet; then
            git commit -m "Record temporary compatibility release $TAG"
            git pull --rebase origin temporary/dramatic-shape-fork-compat
            git push origin HEAD:temporary/dramatic-shape-fork-compat
          fi
