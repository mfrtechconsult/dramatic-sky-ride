name: Publish temporary compatibility build

on:
  push:
    branches:
      - temporary/dramatic-shape-fork-compat
    paths:
      - dramatic_sky_ride/manifest.json
      - dramatic_sky_ride/src/**
      - dramatic_sky_ride/TESTING_BATTLE_ART.md
      - .github/workflows/temporary-compat-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Record workflow start
        shell: bash
        run: |
          printf 'started_for=%s\nstarted_at=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > .github/temporary-workflow-start.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/temporary-workflow-start.txt
          git commit -m "Record temporary workflow start" || true
          git push origin HEAD:temporary/dramatic-shape-fork-compat

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("dramatic_sky_ride/manifest.json", encoding="utf-8"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=dramatic_sky_ride-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Install LuaJIT
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Validate repository runtime source
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool dramatic_sky_ride/manifest.json > /dev/null
          : > /tmp/dramatic_sky_ride.lua
          while IFS= read -r part; do
            test -n "$part" || continue
            cat "dramatic_sky_ride/src/$part" >> /tmp/dramatic_sky_ride.lua
          done < dramatic_sky_ride/src/parts.txt
          luajit -b /tmp/dramatic_sky_ride.lua /tmp/dramatic_sky_ride.ljbc
          luajit -b dramatic_sky_ride/main.lua /tmp/dsr_main.ljbc
          luajit -b dramatic_sky_ride/mod.card /tmp/dsr_card.ljbc
          echo "Repository runtime concat lines: $(wc -l < /tmp/dramatic_sky_ride.lua)"

      - name: Build launcher-ready ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.version.outputs.archive }}"
          (
            cd dramatic_sky_ride
            zip -qr "../$ARCHIVE" . \
              -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store" "Thumbs.db"
          )
          unzip -Z1 "$ARCHIVE" | grep -qx 'manifest.json'
          unzip -t "$ARCHIVE"

      - name: Validate exact release ZIP with LuaJIT
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.version.outputs.archive }}"
          rm -rf /tmp/dsr-release-check
          mkdir -p /tmp/dsr-release-check
          unzip -q "$ARCHIVE" -d /tmp/dsr-release-check
          python -m json.tool /tmp/dsr-release-check/manifest.json > /dev/null
          : > /tmp/dsr-release-sky-ride.lua
          while IFS= read -r part; do
            test -n "$part" || continue
            cat "/tmp/dsr-release-check/src/$part" >> /tmp/dsr-release-sky-ride.lua
          done < /tmp/dsr-release-check/src/parts.txt
          luajit -b /tmp/dsr-release-sky-ride.lua /tmp/dsr-release-sky-ride.ljbc
          luajit -b /tmp/dsr-release-check/main.lua /tmp/dsr-release-main.ljbc
          luajit -b /tmp/dsr-release-check/mod.card /tmp/dsr-release-card.ljbc
          if grep -q 'main_20a_dramatic_compat.lua\|main_20b_battle_provider_compat.lua' /tmp/dsr-release-check/src/parts.txt; then
            echo "Obsolete compatibility chunks are still present in the release archive" >&2
            exit 92
          fi
          echo "Release ZIP runtime concat lines: $(wc -l < /tmp/dsr-release-sky-ride.lua)"
          sha256sum "$ARCHIVE"

      - name: Prepare prerelease notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          ## Temporary Dramatic Shape / Battle Art compatibility build

          Main/stable remains v0.1.0. This temporary build supports either voxel provider through the same public `exports.lib` seam used by DSR.

          - Upstream Dramatic Shape: `DRAMATIC_SHAPE >=1.7.0 <2.0.0` (current upstream checked against 1.7.2).
          - Battle Art Voxel Fork: `BATTLE_ART_VOXEL_FORK >=1.7.6 <2.0.0` (checked against the actual 1.7.6 release tag, not the stale repository master).
          - No Battle Art internals are patched or copied. DSR only selects the installed provider's public library.
          - The previous standalone compatibility chunks were removed from `parts.txt`; provider selection now lives in DSR's existing Dramatic Shape loader.
          - Ground Ride dismounts before a staged battle snapshots the overworld cast, preserving clean Battle Art battle entry and normal remount afterward.
          - Controller shortcuts avoid current engine/voxel controls: X = Flight, Y = Ground Ride. Keyboard remains F/G. L2/R2 remain altitude controls only while airborne and are consumed before the engine speed hotkey can also fire.
          - Wild Skies `>=1.3.1 <2.0.0` remains optional and uses its public API.
          - `free_fly` remains a conflicting alternative flight engine.
          - Do not enable both voxel providers at the same time.
          - The built ZIP itself is unpacked, reconstructed exactly like Gen1Recomp's runtime source, and compiled with LuaJIT before publication.

          The attached ZIP is launcher-ready: `manifest.json` is at the archive root.
          NOTES

      - name: Create or update temporary prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "Dramatic Sky Ride $VERSION (temporary compatibility build)" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi

      - name: Record successful temporary publication
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        shell: bash
        run: |
          git pull --rebase origin temporary/dramatic-shape-fork-compat
          printf 'version=%s\ntag=%s\nasset=%s\ncommit=%s\n' \
            "$VERSION" "$TAG" "$ARCHIVE" "$GITHUB_SHA" > .github/temporary-released-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/temporary-released-version
          if ! git diff --cached --quiet; then
            git commit -m "Record temporary compatibility release $TAG"
            git push origin HEAD:temporary/dramatic-shape-fork-compat
          fi
