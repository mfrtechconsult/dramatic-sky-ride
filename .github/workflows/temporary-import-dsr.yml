name: Temporary DSR branch import

on:
  push:
    branches:
      - temporary/0.1.3-dual-voxel-compat
    paths:
      - .tmp/READY

permissions:
  contents: write

jobs:
  import-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Rebuild exact test ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/dsr.part.* | base64 -d > /tmp/dsr-test.zip
          echo "1f6bd8786d08510dad253b7923852f663710d3820996018187e1dd05f57890e8  /tmp/dsr-test.zip" | sha256sum -c -
          unzip -t /tmp/dsr-test.zip

      - name: Import mod sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dramatic_sky_ride
          mkdir -p dramatic_sky_ride
          unzip -q /tmp/dsr-test.zip -d dramatic_sky_ride

      - name: Validate concatenated runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y luajit
          python -m json.tool dramatic_sky_ride/manifest.json > /dev/null
          : > /tmp/sky_ride.lua
          while IFS= read -r part; do
            test -n "$part" || continue
            cat "dramatic_sky_ride/src/$part" >> /tmp/sky_ride.lua
          done < dramatic_sky_ride/src/parts.txt
          luajit -b /tmp/sky_ride.lua /tmp/sky_ride.ljbc
          luajit -b dramatic_sky_ride/main.lua /tmp/dsr_main.ljbc
          luajit -b dramatic_sky_ride/mod.card /tmp/dsr_card.ljbc

      - name: Commit exact temporary build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .tmp
          git rm .github/workflows/temporary-import-dsr.yml
          git add dramatic_sky_ride
          git commit -m "Import 0.1.3-test.3 temporary dual-voxel build"
          git push origin HEAD:temporary/0.1.3-dual-voxel-compat
