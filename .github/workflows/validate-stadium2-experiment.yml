name: Validate Stadium 2 experiment

on:
  push:
    branches:
      - experiment/stadium2-3d
    paths:
      - dramatic_sky_ride/manifest.json
      - dramatic_sky_ride/src/**
      - dramatic_sky_ride/STADIUM2_TESTING.md
      - .github/workflows/validate-stadium2-experiment.yml
  pull_request:
    branches:
      - main
    paths:
      - dramatic_sky_ride/manifest.json
      - dramatic_sky_ride/src/**
      - dramatic_sky_ride/STADIUM2_TESTING.md
      - .github/workflows/validate-stadium2-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsr-stadium2-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LuaJIT
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Validate manifest and experimental source order
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool dramatic_sky_ride/manifest.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('dramatic_sky_ride')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          version = manifest['version']
          if not version.startswith('0.2.0-alpha.'):
              raise SystemExit(f'experimental branch must use 0.2.0-alpha.*, got {version}')

          parts = [p.strip() for p in (root / 'src/parts.txt').read_text().splitlines() if p.strip()]
          required = [
              'main_41_stadium2_3d.lua',
              'main_42_stadium2_hardening.lua',
              'main_43_stadium2_provider_rig.lua',
              'main_45_stadium2_interpolated_fallback.lua',
              'main_44_stadium2_diagnostics.lua',
          ]
          positions = []
          for name in required:
              if name not in parts:
                  raise SystemExit(f'missing Stadium 2 source part: {name}')
              positions.append(parts.index(name))
          if positions != sorted(positions):
              raise SystemExit(f'invalid Stadium 2 source order: {list(zip(required, positions))}')

          source = '\n'.join((root / 'src' / name).read_text(encoding='utf-8') for name in required)
          for token in ('C2DSM10', 'stadium3DNative', 'stadium3DHardening',
                        'stadium3DProviderRig', 'stadium3DFallback',
                        'stadium3DDiagnostics'):
              if token not in source:
                  raise SystemExit(f'missing Stadium 2 contract token: {token}')
          PY

      - name: Compile exact runtime concatenation with LuaJIT
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('dramatic_sky_ride')
          parts = [p.strip() for p in (root / 'src/parts.txt').read_text().splitlines() if p.strip()]
          chunks = []
          previous_ends_semicolon = False
          for part in parts:
              path = root / 'src' / part
              if not path.is_file():
                  raise SystemExit(f'missing source part: {path}')
              text = path.read_text(encoding='utf-8')
              if previous_ends_semicolon:
                  i = 0
                  while i < len(text) and text[i].isspace():
                      i += 1
                  if i < len(text) and text[i] == ';':
                      text = text[:i] + text[i + 1:]
              chunks.append(text)
              previous_ends_semicolon = text.rstrip().endswith(';')
          Path('/tmp/dramatic_sky_ride.lua').write_text(''.join(chunks), encoding='utf-8')
          PY

          luajit -b /tmp/dramatic_sky_ride.lua /tmp/dramatic_sky_ride.ljbc
          luajit -b dramatic_sky_ride/main.lua /tmp/dsr_main.ljbc
          luajit -b dramatic_sky_ride/mod.card /tmp/dsr_card.ljbc
          echo "Runtime concat lines: $(wc -l < /tmp/dramatic_sky_ride.lua)"

      - name: Reject release-only regressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -F 'require("src.link.Json")' dramatic_sky_ride/src \
             || grep -R -n -F 'Json.decode' dramatic_sky_ride/src; then
            echo "Runtime source must not depend on network-gated src.link.Json" >&2
            exit 1
          fi
