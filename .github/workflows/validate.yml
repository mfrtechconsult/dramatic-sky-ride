name: Validate mod

on:
  push:
    paths-ignore:
      - docs/gen2check-latest.txt
      - docs/lua-syntax-latest.txt
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate manifest JSON
        run: python -m json.tool dramatic_sky_ride/manifest.json > /dev/null
      - name: Validate Gen1 Surf hotfix contract
        run: python3 tests/gen1_surf_contract.py dramatic_sky_ride
      - name: Validate Gen2 engine compatibility contract
        run: python3 tests/gen2_engine_compat_contract.py dramatic_sky_ride
      - name: Validate Wild Skies Gen2 contract
        run: python3 tests/wild_skies_gen2_contract.py dramatic_sky_ride
      - name: Validate follower provider bridge contract
        run: python3 tests/follower_provider_bridge_contract.py dramatic_sky_ride
      - name: Validate Open Sky release contract
        run: python3 tests/gen2_open_sky_release_contract.py dramatic_sky_ride
      - name: Validate Gen1 Surf transition syntax
        run: luac -p dramatic_sky_ride/src/main_26b_gen1_surf_runtime.lua
      - name: Validate Gen2 runtime bridge syntax
        run: luac -p dramatic_sky_ride/src/main_21b_gen2_runtime.lua
      - name: Validate Gen2 progression syntax
        run: luac -p dramatic_sky_ride/src/main_22b_gen2_progression.lua
      - name: Validate Wild Skies integration syntax
        run: luac -p dramatic_sky_ride/src/main_24_wild_skies.lua
      - name: Validate Open Sky module syntax
        run: |
          luac -p dramatic_sky_ride/src/main_53b_gen2_open_sky.lua
          luac -p dramatic_sky_ride/src/main_53c_gen2_open_sky_playable.lua
          luac -p dramatic_sky_ride/src/main_53d_gen2_open_sky_runtime_guard.lua
          luac -p dramatic_sky_ride/src/main_53e_gen2_open_sky_input_latch.lua
          luac -p dramatic_sky_ride/src/main_53f_gen2_open_sky_art_map.lua
          luac -p dramatic_sky_ride/src/main_53g_gen2_open_sky_stadium2_3d.lua
      - name: Rebuild and validate Lua syntax
        id: lua_syntax
        shell: bash
        run: |
          set +e
          : > /tmp/dramatic_sky_ride.lua
          while IFS= read -r part; do
            [ -z "$part" ] && continue
            cat "dramatic_sky_ride/src/$part" >> /tmp/dramatic_sky_ride.lua
          done < dramatic_sky_ride/src/parts.txt
          luac -p dramatic_sky_ride/main.lua dramatic_sky_ride/mod.card /tmp/dramatic_sky_ride.lua \
            > /tmp/lua-syntax-latest.txt 2>&1
          status=$?
          cat /tmp/lua-syntax-latest.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish latest Lua syntax report
        if: always() && github.event_name == 'push' && github.ref_name == 'agent/gen2-gen1recomp-plus-compat'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo '# Generated by .github/workflows/validate.yml'
            echo '# luac status: ${{ steps.lua_syntax.outputs.status }}'
            echo
            cat /tmp/lua-syntax-latest.txt 2>/dev/null || true
          } > docs/lua-syntax-latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/lua-syntax-latest.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update Lua syntax report [skip ci]'
            git push
          fi
      - name: Fail on Lua syntax error
        if: steps.lua_syntax.outputs.status != '0'
        run: exit 1
      - name: Build and validate install archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("dramatic_sky_ride/manifest.json", encoding="utf-8"))["version"])')
          ARCHIVE="/tmp/dramatic-sky-ride-open-sky-$VERSION-launcher-ready.zip"
          (
            cd dramatic_sky_ride
            zip -qr "$ARCHIVE" . -x "*/__pycache__/*" "*.pyc" "*.pyo" ".DS_Store" "Thumbs.db"
          )
          unzip -Z1 "$ARCHIVE" | grep -qx 'manifest.json'
          unzip -t "$ARCHIVE"
          cp "$ARCHIVE" "$GITHUB_WORKSPACE/"
      - name: Upload Open Sky launcher-ready candidate
        if: github.event_name == 'push' && github.ref_name == 'release/0.2.14-open-sky'
        uses: actions/upload-artifact@v4
        with:
          name: dramatic-sky-ride-open-sky-0.2.14-launcher-ready
          path: dramatic-sky-ride-open-sky-0.2.14-launcher-ready.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Gen2 voxel test archive
        if: github.event_name == 'push' && github.ref_name == 'agent/gen2-stadium2-voxel-interop'
        uses: actions/upload-artifact@v4
        with:
          name: dramatic-sky-ride-gen2-voxel-test
          path: /tmp/dramatic-sky-ride-open-sky-*.zip
          if-no-files-found: error
          retention-days: 7
