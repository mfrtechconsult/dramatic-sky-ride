name: Wilds compatibility CI

on:
  push:
    branches:
      - compat/wilds-of-kanto
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wilds-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-compat:
    name: Gen1Recomp headless compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sky Ride compatibility branch
        uses: actions/checkout@v7
        with:
          path: sky

      - name: Checkout Deep Dive compatibility branch
        uses: actions/checkout@v7
        with:
          repository: mfrtechconsult/Dramatic-Deep-Dive
          ref: compat/wilds-of-kanto
          path: deep

      - name: Checkout PokéPC compatibility branch
        uses: actions/checkout@v7
        with:
          repository: mfrtechconsult/PokePCFollowers
          ref: compat/wilds-of-kanto
          path: pokepc

      - name: Checkout Kanto Dive compatibility branch
        uses: actions/checkout@v7
        with:
          repository: mfrtechconsult/Kanto-gen1-dive
          ref: compat/wilds-of-kanto
          path: kanto

      - name: Checkout Wilds of Kanto
        uses: actions/checkout@v7
        with:
          repository: YoDrehDenSwagAuf/overworld-spawn-mod
          ref: main
          path: wilds

      - name: Checkout Dramaless Shape
        uses: actions/checkout@v7
        with:
          repository: artyrambles/DRAMALESS_SHAPE
          ref: main
          path: dramaless

      - name: Checkout Battle Art Voxel Fork
        uses: actions/checkout@v7
        with:
          repository: absol89/DramaticShapeVoxelMod
          ref: feature/battle-art
          path: battleart

      - name: Checkout Gen1Recomp dev
        uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: dev
          path: engine

      - name: Install LuaJIT and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
          python3 -m pip install --upgrade pillow
          luajit -v

      - name: Validate compatibility manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          sky = read("sky/dramatic_sky_ride/manifest.json")
          deep = read("deep/dramatic_deep_dive/manifest.json")
          pc = read("pokepc/manifest.json")
          kanto = read("kanto/kanto_dive/manifest.json")

          assert sky["dependencies"] == []
          assert "overworld_wild_spawns" in sky["optional_dependencies"]
          assert "PokePCFollowers_VoxelMerge" in sky["optional_dependencies"]

          assert deep["dependencies"] == []
          assert "overworld_wild_spawns" in deep["optional_dependencies"]
          assert "PokePCFollowers_VoxelMerge" in deep["optional_dependencies"]

          assert "overworld_wild_spawns" in pc["optional_dependencies"]
          assert "overworld_wild_spawns" in kanto["optional_dependencies"]
          print("manifest compatibility contracts: PASS")
          PY

      - name: Compile compatibility sources with LuaJIT
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("sky/dramatic_sky_ride/src")
          parts = [line.strip() for line in (root / "parts.txt").read_text().splitlines() if line.strip()]
          source = "".join((root / part).read_text(encoding="utf-8") for part in parts)
          Path("/tmp/dramatic_sky_ride_assembled.lua").write_text(source, encoding="utf-8")
          print(f"assembled {len(parts)} Sky Ride source parts")
          PY

          luajit -b /tmp/dramatic_sky_ride_assembled.lua /tmp/dramatic_sky_ride.luac
          luajit -b sky/dramatic_sky_ride/main.lua /tmp/sky_entry.luac
          luajit -b sky/tests/wilds_guard_smoke.lua /tmp/wilds_guard_smoke.luac
          luajit -b sky/tests/wilds_loader_stack.lua /tmp/wilds_loader_stack.luac

          for root in deep/dramatic_deep_dive pokepc kanto/kanto_dive; do
            while IFS= read -r -d '' file; do
              luajit -b "$file" /tmp/compat_check.luac
            done < <(find "$root" -name '*.lua' -type f -print0)
          done
          echo "LuaJIT compilation: PASS"

      - name: Run Gen1Recomp ROM-free baseline
        working-directory: engine
        run: ./scripts/test.sh

      - name: Run cooperative guard regressions
        working-directory: engine
        run: luajit ../sky/tests/wilds_guard_smoke.lua

      - name: Dramaless + Wilds + Sky + Deep
        working-directory: engine
        env:
          PROVIDER_PATH: dramaless
          PROVIDER_ID: DRAMALESS_SHAPE
          STACK_TARGET: deep
        run: luajit ../sky/tests/wilds_loader_stack.lua

      - name: Dramaless + Wilds + Sky + Kanto
        working-directory: engine
        env:
          PROVIDER_PATH: dramaless
          PROVIDER_ID: DRAMALESS_SHAPE
          STACK_TARGET: kanto
        run: luajit ../sky/tests/wilds_loader_stack.lua

      - name: Battle Art + Wilds + Sky + Deep
        working-directory: engine
        env:
          PROVIDER_PATH: battleart
          PROVIDER_ID: BATTLE_ART_VOXEL_FORK
          STACK_TARGET: deep
        run: luajit ../sky/tests/wilds_loader_stack.lua

      - name: Battle Art + Wilds + Sky + Kanto
        working-directory: engine
        env:
          PROVIDER_PATH: battleart
          PROVIDER_ID: BATTLE_ART_VOXEL_FORK
          STACK_TARGET: kanto
        run: luajit ../sky/tests/wilds_loader_stack.lua
