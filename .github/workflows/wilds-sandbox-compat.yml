name: Wilds sandbox compatibility

on:
  push:
    branches:
      - compat/wilds-2.1.5-sandbox
    paths:
      - 'dramatic_sky_ride/**'
      - 'tests/wilds_guard_smoke.lua'
      - 'tests/wilds_sandbox_loader.lua'
      - '.github/workflows/wilds-sandbox-compat.yml'
  pull_request:
    paths:
      - 'dramatic_sky_ride/**'
      - 'tests/wilds_guard_smoke.lua'
      - 'tests/wilds_sandbox_loader.lua'
      - '.github/workflows/wilds-sandbox-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-compat:
    name: Wilds 2.1.5+ / Gen1Recomp sandbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dramatic Sky Ride
        uses: actions/checkout@v4
        with:
          path: sky

      - name: Checkout Wilds of Kanto
        uses: actions/checkout@v4
        with:
          repository: YoDrehDenSwagAuf/overworld-spawn-mod
          ref: main
          path: wilds

      - name: Checkout Gen1Recomp dev
        uses: actions/checkout@v4
        with:
          repository: bryanthaboi/gen1recomp
          ref: dev
          path: engine

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
          luajit -v

      - name: Verify sandbox manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          sky = json.loads(Path('sky/dramatic_sky_ride/manifest.json').read_text())
          wilds = json.loads(Path('wilds/manifest.json').read_text())
          assert 'filesystem' not in sky.get('permissions', [])
          assert 'filesystem' not in wilds.get('permissions', [])
          assert 'overworld_wild_spawns' in [x.split('@', 1)[0] for x in sky.get('optional_dependencies', [])]
          assert wilds['id'] == 'overworld_wild_spawns'
          print('sandbox manifest contract: PASS')
          PY

      - name: Reject removed compatibility surfaces
        run: |
          set -euo pipefail
          FILE=sky/dramatic_sky_ride/src/main_27_wilds_compat.lua
          ! grep -n 'debug\.getupvalue\|debug\.setupvalue\|love\.filesystem\|io\.open' "$FILE"
          grep -n 'resolveFollowerSprite' "$FILE"
          grep -n 'syncAll' "$FILE"
          grep -n 'sandbox_public_exports' "$FILE"
          echo 'public API only contract: PASS'

      - name: Compile changed compatibility code
        run: |
          luajit -b sky/dramatic_sky_ride/src/main_27_wilds_compat.lua /tmp/main_27.ljbc
          luajit -b sky/tests/wilds_guard_smoke.lua /tmp/wilds_guard.ljbc
          luajit -b sky/tests/wilds_sandbox_loader.lua /tmp/wilds_loader.ljbc

      - name: Run synthetic sandbox bridge smoke
        working-directory: engine
        run: luajit ../sky/tests/wilds_guard_smoke.lua

      - name: Run real Gen1Recomp loader stack
        working-directory: engine
        run: luajit ../sky/tests/wilds_sandbox_loader.lua
